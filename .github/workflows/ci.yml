# CI. This repo is public, so Actions are free: run the full code gate here.
# `nix flake check` covers the Go unit + race suites, the evalModules schema
# check and the README table; the lint job adds the static-analysis + security
# battery; one-distro boots a real VM on a KVM-capable hosted runner. The full
# 8-distro matrix runs on a dedicated KVM host via the `.#matrix` apps, not here.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build and test
        run: |
          CGO_ENABLED=0 go build ./...
          go test ./...

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          test -z "$(gofumpt -l .)"

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: nix flake check
        run: nix flake check --no-build || nix flake check

      - name: Link check (distro images and docs)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml README.md
          fail: true

  # The static-analysis + security battery (matches the family's bar). Free on a
  # public repo, so it runs on every push now.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: vet + staticcheck + errcheck
        run: |
          go vet ./...
          go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...
          go install github.com/kisielk/errcheck@latest && errcheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # G204 (subprocess) and G304/G703 (reading a config-named path) are
          # inherent to a VM-orchestration tool; see the justfile.
          gosec -quiet -exclude=G204,G304,G703 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # A real single-distro smoke on a KVM-capable hosted runner: the actual
  # boot -> provision -> check -> teardown lifecycle, in CI, for free. A hosted
  # ubuntu-latest run confirmed nested KVM works, so this is a real gate. The
  # authoritative full 8-distro matrix runs on a dedicated KVM host.
  one-distro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = kvm nixos-test benchmark big-parallel
      - name: Smoke on Ubuntu 24.04
        run: nix run .#distro-ubuntu-2404
