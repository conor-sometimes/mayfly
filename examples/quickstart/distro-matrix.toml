# The headline path: one file describes the whole run. From this directory,
#   nix run github:conor-sometimes/distro-matrix
# boots each distro, installs the packages, copies the files, runs the test,
# and tears every VM down. `-f other.toml` points elsewhere.
#
# This sample tests the distro itself (no binary under test): the named
# packages install, a file lands, and the check passes. Add `binary = "./foo"`
# and `unit = "./foo.service"` to test your own daemon.

distros = ["ubuntu-2404"]

packages = ["curl", "python3"]

[files]
"/etc/quickstart/hello.txt" = "./hello.txt"

test = "./check.sh"
